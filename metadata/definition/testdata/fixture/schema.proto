syntax = "proto3";
package fixture;
option go_package = "dubbo.apache.org/dubbo-go/v3/metadata/definition/testdata/fixture";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
service Greeter {
  rpc Greet(Request) returns (google.protobuf.Empty);
  rpc Watch(Request) returns (stream Request);
}
message Request {
  string display_name = 1;
  int32 count = 2;
  int64 total = 3;
  bool active = 4;
  bytes data = 5;
  double ratio = 6;
  float score = 7;
  Status status = 8;
  repeated Nested children = 9;
  map<string, Nested> lookup = 10;
  oneof choice { string text = 11; Nested nested = 12; }
  google.protobuf.Timestamp timestamp = 13;
  google.protobuf.StringValue wrapper = 14;
  Request next = 15;
  message Nested { string value = 1; }
}
enum Status { UNKNOWN = 0; READY = 1; }
