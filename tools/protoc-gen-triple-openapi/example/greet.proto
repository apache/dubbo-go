syntax = "proto3";

package greet;

option go_package = "dubbo.apache.org/dubbo-go/v3/tools/protoc-gen-triple-openapi/example;greet";

enum GreetingType {
  GREETING_TYPE_UNSPECIFIED = 0;
  GREETING_TYPE_FORMAL = 1;
}

message GreetRequest {
  string name = 1;
  repeated string aliases = 2;
  map<string, string> metadata = 3;
  GreetingType type = 4;
  GreetProfile profile = 5;
  repeated GreetingType types = 6;
  repeated GreetProfile profiles = 7;
  map<string, GreetProfile> profile_metadata = 8;
  map<string, GreetingType> type_metadata = 9;
}

message GreetProfile {
  string salutation = 1;
}

message GreetResponse {
  string greeting = 1;
}

message GreetUserRequest {
  string name = 1;
}

message GreetUserResponse {
  string greeting = 1;
}

service GreetService {
  rpc Greet(GreetRequest) returns (GreetResponse) {}

  rpc GreetUser(GreetUserRequest) returns (GreetUserResponse) {}
}
