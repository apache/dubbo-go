services:
  nacos:
    image: nacos/nacos-server:v2.5.2
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:18848:8848"
      - "127.0.0.1:19848:9848"
      - "127.0.0.1:19849:9849"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  zookeeper:
    image: zookeeper:3.9.4
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr
    ports:
      - "127.0.0.1:21811:2181"
