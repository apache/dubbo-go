name: RISC-V Build

on:
  push:
    branches:
      - main
      - 'release-*'
      - 'feature-*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: riscv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  RISC-V-Build:
    name: RISC-V Build (linux/riscv64)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Build for linux/riscv64
        run: make build GOOS=linux GOARCH=riscv64 CGO_ENABLED=0
