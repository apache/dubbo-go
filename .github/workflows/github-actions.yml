name: CI

on:
  push:
    branches:
      - main
      - 'release-*'
      - 'feature-*'
  pull_request:
    branches: "*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  license:
    name: Check License Header
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check License Header
        uses: apache/skywalking-eyes/header@main #NOSONAR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .licenserc.yaml
          mode: check

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Backs the ZooKeeper-dependent unit tests under config_center/zookeeper
      # (see #3459/#3690): they connect to ZK_ADDR (default 127.0.0.1:2181)
      # and, without a reachable server, silently skip instead of exercising
      # the migrated client, so we run a real instance here.
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Wait for ZooKeeper
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2181) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            sleep 1
          done
          echo "zookeeper did not become reachable on 127.0.0.1:2181" >&2
          exit 1

      - name: Run unit tests
        env:
          ZK_ADDR: 127.0.0.1:2181
        run: make test

      - name: Race Test
        run: make test-race

      - name: Codecov
        uses: codecov/codecov-action@v7 #NOSONAR
        with:
          files: coverage.txt
          fail_ci_if_error: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)

  Integration-Test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run integration tests
        env:
          INTEGRATION_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          INTEGRATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INTEGRATION_BRANCH: ${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}
        run: ./integrate_test.sh "$INTEGRATION_REPO" "$INTEGRATION_SHA" "$INTEGRATION_BRANCH"
